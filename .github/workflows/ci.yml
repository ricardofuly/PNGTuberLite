name: Continuous Integration & Tests

on:
  push:
    branches: [ main, master, 'hotfix/*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Install Linux Audio and Graphics Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxi-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libasound2-dev

      - name: Run All Tests
        run: go test -v ./pkg/...

      - name: Verify Build
        run: go build -v -o pngtuber-lite .
