name: Build and Release PNGTuber Lite

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxi-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libasound2-dev

      - name: Run Tests
        run: go test -v ./pkg/...

  build-linux:
    name: Build Linux x86_64
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxi-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libasound2-dev

      - name: Determine Version
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="${{ inputs.version_tag }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Build Linux Binary
        run: |
          go build -ldflags="-s -w -X 'pngtuber-lite/pkg/updater.CurrentVersion=${{ steps.version.outputs.tag }}' -Wl,--allow-multiple-definition" -o pngtuber-lite main.go

      - name: Package Linux Release
        run: |
          mkdir -p release-linux
          cp pngtuber-lite README.md config.json defaultAvatar.save release-linux/
          cp -r assets release-linux/
          tar -czvf pngtuber-lite-linux-amd64.tar.gz -C release-linux .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pngtuber-lite-linux-amd64
          path: pngtuber-lite-linux-amd64.tar.gz

  build-windows:
    name: Build Windows x86_64
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Determine Version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ([string]::IsNullOrEmpty($tag) -or $tag -eq "main") {
            $tag = "${{ inputs.version_tag }}"
          }
          echo "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Build Windows Binary
        run: |
          go build -ldflags="-s -w -X 'pngtuber-lite/pkg/updater.CurrentVersion=${{ steps.version.outputs.tag }}'" -o pngtuber-lite.exe main.go

      - name: Package Windows Release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-windows
          Copy-Item pngtuber-lite.exe, README.md, config.json, defaultAvatar.save -Destination release-windows/
          Copy-Item -Recurse assets -Destination release-windows/
          Compress-Archive -Path release-windows/* -DestinationPath pngtuber-lite-windows-amd64.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pngtuber-lite-windows-amd64
          path: pngtuber-lite-windows-amd64.zip

  publish-release:
    name: Publish GitHub Release & Checksums
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: pngtuber-lite-linux-amd64

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: pngtuber-lite-windows-amd64

      - name: Generate Checksums
        run: |
          sha256sum pngtuber-lite-linux-amd64.tar.gz pngtuber-lite-windows-amd64.zip > checksums.txt

      - name: Determine Tag
        id: get_tag
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="${{ inputs.version_tag }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: "PNGTuber Lite ${{ steps.get_tag.outputs.tag }}"
          files: |
            pngtuber-lite-linux-amd64.tar.gz
            pngtuber-lite-windows-amd64.zip
            checksums.txt
          draft: false
          prerelease: false
          generate_release_notes: true
